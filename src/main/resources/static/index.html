<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ricerca Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="/js/film.js" defer></script>
    <style>
        body {
          background: #0d1117;
          color: #f0f6fc;
          font-family: 'Segoe UI', sans-serif;
        }

        h1 {
          margin-top: 30px;
          font-weight: 700;
        }

        .search-bar {
          max-width: 600px;
          margin: 30px auto;
        }

        .card-film {
          background-color: #161b22;
          border: 1px solid #30363d;
          border-radius: 10px;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
          transition: transform 0.2s;
          height: 100%;
          display: flex;
          flex-direction: column;
        }

        .card-film:hover {
          transform: scale(1.02);
        }

        .poster {
          width: 100%;
          height: 380px;
          object-fit: cover;
          border-top-left-radius: 10px;
          border-top-right-radius: 10px;
        }

        .card-body {
          flex: 1;
          padding: 18px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }

        .card-title {
          font-size: 1.1rem;
          font-weight: 600;
          margin-bottom: 0.5rem;
          word-wrap: break-word; /*  evita overflow */
        }

        .btn-dettagli {
          background-color: #238636;
          color: white;
          border: none;
          width: 100%;
        }

        .btn-dettagli:hover {
          background-color: #2ea043;
        }

        .dettagli-container {
          background-color: #21262d;
          padding: 12px 16px;
          border-radius: 6px;
          margin-top: 12px;
          font-size: 0.9rem;
          line-height: 1.5;
          max-height: 260px;
          overflow-y: auto;
          text-align: left;
        }

        /* Margine uniforme tra le card */
        .film-col {
          margin-bottom: 25px;
        }
    </style>

</head>
<body>
<!--  Barra utente in alto -->
<div class="container-fluid bg-primary py-2 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="/" class="navbar-brand text-light fw-bold d-flex align-items-center">
            <i class="bi bi-film me-2"></i> Film
        </a>

        <div class="d-flex align-items-center gap-3">
            <span class="text-light" id="messaggioBenvenuto"></span>

            <form action="/logout" method="GET" style="display:inline;">
                <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </div>
</div>

<!-- Bottone Preferiti sotto la barra blu -->
<div class="container text-end mt-3">
    <a href="/preferiti.html" class="btn btn-outline-warning btn-sm">
        <i class="bi bi-star-fill text-warning"></i> Preferiti
    </a>
</div>


    <div class="container my-4">
        <h1 class="text-primary text-center mb-4">
            <i class="bi bi-film"></i> Ricerca Film
        </h1>

        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="titolo" class="form-control" placeholder="Inserisci titolo...">
                    <button class="btn btn-success" onclick="cercaFilm()">Cerca</button>
                </div>
            </div>
        </div>

        <div id="risultati" class="row gy-4"></div>
    </div>


<!-- Modal Dettagli Film -->
    <div class="modal fade" id="filmModal" tabindex="-1" aria-labelledby="filmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="filmModalLabel">Dettagli Film</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Chiudi"></button>
                </div>
                <div class="modal-body" id="filmModalBody">
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
        <div id="toastMessage" class="toast align-items-center text-bg-dark border-0" role="alert">
            <div class="d-flex">
                <div id="toastText" class="toast-body">Messaggio...</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
