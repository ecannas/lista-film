<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Preferiti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="/js/preferiti.js" defer></script>
<style>
    body {
      background: #0d1117;
      color: #f0f6fc;
      font-family: 'Segoe UI', sans-serif;
    }

    h1, h2, h3 {
      color: #f0f6fc;
      font-weight: 700;
    }

    /* Navbar blu in alto */
    .container-fluid.bg-primary {
      background-color: #0d6efd !important;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .navbar-brand {
      font-weight: 700;
      color: #ffffff !important;
    }

    .navbar-brand:hover {
      color: #dbeafe !important;
    }

    /* Pulsanti logout */
    .btn-outline-light.btn-sm {
      font-size: 0.875rem;
      padding: 4px 10px;
    }

    .btn-outline-light.btn-sm:hover {
      color: #fff;
      background-color: #2ea043;
      border-color: #2ea043;
    }

    #usernameDisplay, #messaggioBenvenuto {
      font-weight: 500;
    }

    main, #main-content {
      margin-top: 20px;
    }
</style>
</head>

<body class="bg-dark text-light">

<!-- Navbar con nome utente e logout a destra -->
<div class="container-fluid bg-primary py-2 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="/" class="navbar-brand text-light fw-bold d-flex align-items-center">
            <i class="bi bi-film me-2"></i> Film
        </a>

        <a href="/index.html" class="btn btn-outline-light btn-sm me-3">
            <i class="bi bi-house-door"></i> Home
        </a>

        <div class="d-flex align-items-center gap-3">
            <span class="text-light" id="usernameDisplay"></span>
            <form action="/logout" method="GET" style="display:inline;">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>
    </div>
</div>


<!-- Contenuto principale -->
<div class="container mt-4">
    <h2 class="mb-4 text-warning"><i class="bi bi-star-fill"></i> I miei film preferiti</h2>
    <div id="lista-preferiti" class="row gy-4"></div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="toastMessage" class="toast align-items-center text-bg-dark border-0" role="alert">
        <div class="d-flex">
            <div id="toastText" class="toast-body">Messaggio...</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
