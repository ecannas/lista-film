<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Lista Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">

<div class="card bg-secondary text-light p-4" style="width: 380px;">
    <h3 class="text-center mb-4">
        <i class="bi bi-box-arrow-in-right"></i> Accedi
    </h3>

    <form method="POST" action="/login">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-control" required autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>

        <input type="hidden" name="_csrf" id="csrfInput">
        <button type="submit" class="btn btn-success w-100">Accedi</button>
    </form>

    <div id="msg" class="mt-3 text-center"></div>

    <div class="mt-3 text-center">
        <a href="/register.html" class="text-warning">Non hai un account? Registrati</a>
    </div>
</div>

<script src="/js/utils.js"></script>
<script>
        sessionStorage.removeItem("ultimaRicerca");
        const params = new URLSearchParams(window.location.search);
        const msg = document.getElementById("msg");

        if (params.has("error")) {
            msg.innerHTML = `<span class="text-danger-emphasis"><i class="bi bi-x-circle"></i> Credenziali errate.</span>`;
        } else if (params.has("logout")) {
            msg.innerHTML = `<span class="text-success" style="color:black!important" ><i class="bi bi-check-circle"></i> Logout effettuato con successo.</span>`;
        }

        document.getElementById("csrfInput").value = getCsrfToken();
</script>

</body>
</html>
