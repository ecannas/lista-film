<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrazione - Lista Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">

<div class="card bg-secondary text-light p-4" style="width: 380px;">
    <h3 class="text-center mb-4">
        <i class="bi bi-person-plus"></i> Registrazione
    </h3>

    <form id="registerForm">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" required autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-warning w-100">Registrati</button>
    </form>

    <div id="msg" class="mt-3 text-center"></div>

    <div class="mt-3 text-center">
        <a href="/login.html" class="text-light">Hai già un account? Accedi</a>
    </div>
</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      try {
        const res = await fetch("/utenti/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          msg.innerHTML = `<span style="color: #00bfff; font-weight: bold;">Registrazione avvenuta con successo! <a href="/login.html" class="text-warning">Accedi</a></span>`;
             document.getElementById('username').value = '';
             document.getElementById('password').value = '';
        } else if (res.status === 409) {
          msg.innerHTML = `<span class="text-danger"> Username già esistente.</span>`;
        } else {
          msg.innerHTML = `<span class="text-danger">Errore nella registrazione.</span>`;
        }

      } catch (error) {
        console.error("Errore:", error);
        msg.innerHTML = `<span class="text-danger">Errore di connessione al server.</span>`;
      }
    });
</script>

</body>
</html>
